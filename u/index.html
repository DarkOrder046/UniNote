<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uninote Player</title>
<meta name="description" content="Replay a ukulele song captured by the Uninote device.">
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1d1b16; --muted: #6b665b; --line: #d9d4c7;
    --accent: #c2410c; --accent-ink: #ffffff; --hot: #fde8d8; --staff: #3a362d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14120f; --card: #1f1c17; --ink: #f1ede4; --muted: #a39d8e; --line: #3a362d;
      --accent: #fb923c; --accent-ink: #1a1207; --hot: #3a2412; --staff: #cfc8b6;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14120f; --card: #1f1c17; --ink: #f1ede4; --muted: #a39d8e; --line: #3a362d;
    --accent: #fb923c; --accent-ink: #1a1207; --hot: #3a2412; --staff: #cfc8b6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; margin: 0; color: var(--muted); font-weight: 600; }
  h2 { font-size: 28px; margin: 6px 0 2px; line-height: 1.15; }
  .meta { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .now { display: flex; align-items: center; gap: 18px; min-height: 92px; }
  .now .big { font-size: 64px; font-weight: 700; line-height: 1; min-width: 1.6em; font-variant-numeric: tabular-nums; }
  .now .big small { font-size: 26px; font-weight: 600; color: var(--muted); }
  .now .hz { color: var(--muted); font-size: 18px; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 14px 0 12px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; border-radius: 999px; padding: 10px 22px; border: 1px solid var(--line);
           background: var(--card); color: var(--ink); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; min-width: 112px; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .time { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .staffwrap { overflow-x: auto; margin-top: 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  canvas { display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .chip { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 14px; background: var(--card);
          font-variant-numeric: tabular-nums; cursor: pointer; }
  .chip b { font-size: 16px; }
  .chip span { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .chip.on { background: var(--hot); border-color: var(--accent); }
  .note { color: var(--muted); font-size: 13px; margin-top: 18px; }
  .msg { padding: 24px 4px; }
  .err { color: var(--accent); }
  [hidden] { display: none !important; }
  @media (max-width: 480px) { h2 { font-size: 24px; } .now .big { font-size: 52px; } }
</style>
</head>
<body>
<main>
  <header><h1>Uninote</h1><button id="theme" aria-label="Toggle light or dark" style="padding:6px 14px;font-size:13px">Theme</button></header>

  <div id="status" class="msg" role="status">Loading song&hellip;</div>

  <section id="player" hidden>
    <h2 id="title">Song</h2>
    <p class="meta" id="meta"></p>

    <div class="card">
      <div class="now" aria-live="off">
        <div class="big" id="bigNote">&ndash;</div>
        <div><div class="hz" id="hz">&nbsp;</div><div class="hz" id="idx">&nbsp;</div></div>
      </div>
      <div class="bar"><i id="prog"></i></div>
      <div class="row">
        <button class="primary" id="play">Play</button>
        <button id="restart">Restart</button>
        <span class="time" id="time">0:00 / 0:00</span>
      </div>
    </div>

    <div class="staffwrap" id="staffwrap"><canvas id="staff" aria-label="Notes on a treble staff"></canvas></div>
    <div class="chips" id="chips"></div>
    <p class="note">The notes detected by the Uninote device are replayed here as simple plucked tones &mdash;
      not the original microphone recording. Tap a note to hear it.</p>
  </section>
</main>

<script>
"use strict";
// Where the Uninote device stored the song. Must match READ_URL in the device's config.py.
const READ_URL = "https://jsonblob.com/api/jsonBlob/";

const NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const $ = id => document.getElementById(id);
const fmt = ms => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

/* ---- theme toggle (remembered when storage is available) ---- */
(function () {
  try { const t = localStorage.getItem("uninote-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  $("theme").onclick = () => {
    const dark = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() === "#14120f";
    const t = dark ? "light" : "dark";
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem("uninote-theme", t); } catch (e) {}
    drawStaff();
  };
})();

/* ---- the short token in the QR link -> the store's blob id (reverse of share.token on the device) ---- */
function decodeToken(tok) {
  const kind = tok[0], rest = tok.slice(1);
  if (kind === "u") {
    const b64 = rest.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - rest.length % 4) % 4);
    const hex = Array.from(atob(b64), c => c.charCodeAt(0).toString(16).padStart(2, "0")).join("");
    if (hex.length !== 32) throw new Error("bad link");
    return hex.replace(/^(.{8})(.{4})(.{4})(.{4})(.{12})$/, "$1-$2-$3-$4-$5");
  }
  if (kind === "n") {
    let n = 0n;
    for (const ch of rest) n = n * 36n + BigInt(parseInt(ch, 36));
    return n.toString();
  }
  if (kind === "r") return rest;
  throw new Error("bad link");
}

/* ---- song data ---- */
let song = null;        // {name, a4, notes: [{t0, t1, midi, hz}]}  (times in seconds, first note at 0)
let t0shift = 0;

function demoSong() {
  const seq = [[67,0],[67,.5],[74,1],[74,1.5],[76,2],[76,2.5],[74,3],[72,4],[72,4.5],[71,5],[71,5.5],[69,6],[69,6.5],[67,7]];
  return { name: "Demo: Twinkle", a4: 440,
    notes: seq.map(([m, t]) => ({ t0: t, t1: t + .4, midi: m, hz: 440 * Math.pow(2, (m - 69) / 12) })) };
}

function parseSong(j) {
  if (!j || !Array.isArray(j.notes)) throw new Error("not a Uninote song");
  const raw = j.notes.filter(n => Array.isArray(n) && n.length >= 3);
  if (!raw.length) throw new Error("this song has no notes");
  const a4 = j.a4 || 440, base = raw[0][0];
  return { name: String(j.name || "Song"), a4,
    notes: raw.map(n => ({
      t0: (n[0] - base) / 1000,
      t1: Math.max((n[1] - base) / 1000 + 0.06, (n[0] - base) / 1000 + 0.2),
      midi: n[2],
      hz: n[3] ? n[3] / 10 : a4 * Math.pow(2, (n[2] - 69) / 12) })) };
}

/* ---- staff drawing (same note positions as the OLED) ---- */
const SHARP = [0,1,0,1,0,0,1,0,1,0,1,0], DEG = [0,0,1,1,2,3,3,4,4,5,5,6];
function staffStep(m) { return (Math.floor(m / 12) - 1) * 7 + DEG[m % 12] - 30; }   // 0 = E4 (bottom line)
const GAP = 34, PAD_L = 56, SP = 10;
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function drawStaff(active = -1) {
  if (!song) return;
  const cv = $("staff"), dpr = window.devicePixelRatio || 1;
  const w = Math.max($("staffwrap").clientWidth, PAD_L + song.notes.length * GAP + 20), h = 150;
  cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + "px"; cv.style.height = h + "px";
  const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ink = css("--staff"), acc = css("--accent");
  const ybot = 104;
  c.strokeStyle = ink; c.fillStyle = ink; c.lineWidth = 1;
  for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(8, ybot - i * SP + .5); c.lineTo(w - 8, ybot - i * SP + .5); c.stroke(); }
  c.font = "italic 700 34px Georgia, serif"; c.fillText("G", 14, ybot - SP * 1.2);
  song.notes.forEach((n, i) => {
    const x = PAD_L + i * GAP, s = staffStep(n.midi), y = ybot - s * SP / 2;
    const on = i === active;
    c.strokeStyle = ink;
    for (let k = -2; k >= s; k -= 2) { c.beginPath(); c.moveTo(x - 9, ybot - k * SP / 2 + .5); c.lineTo(x + 9, ybot - k * SP / 2 + .5); c.stroke(); }
    for (let k = 10; k <= s; k += 2) { c.beginPath(); c.moveTo(x - 9, ybot - k * SP / 2 + .5); c.lineTo(x + 9, ybot - k * SP / 2 + .5); c.stroke(); }
    c.fillStyle = c.strokeStyle = on ? acc : ink;
    c.beginPath(); c.ellipse(x, y, 5.5, 4, -0.35, 0, 7); c.fill();
    c.lineWidth = 1.4; c.beginPath();
    if (s < 4) { c.moveTo(x + 5, y); c.lineTo(x + 5, y - 28); } else { c.moveTo(x - 5, y); c.lineTo(x - 5, y + 28); }
    c.stroke(); c.lineWidth = 1;
    if (SHARP[n.midi % 12]) { c.font = "700 15px system-ui, sans-serif"; c.fillText("#", x - 18, y + 5); }
    c.font = "600 12px system-ui, sans-serif"; c.fillStyle = on ? acc : css("--muted");
    c.fillText(NAMES[n.midi % 12], x - 4 * NAMES[n.midi % 12].length, 142);
  });
}

/* ---- audio: a soft plucked tone per note ---- */
let ctx = null, startAt = 0, playing = false, finished = false, raf = 0, total = 0;

function pluck(freq, when, dur) {
  const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
  o.type = "triangle"; o2.type = "sine"; o.frequency.value = freq; o2.frequency.value = freq * 2;
  const g2 = ctx.createGain(); g2.gain.value = 0.25;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(ctx.destination);
  const end = when + Math.max(dur, 0.25) + 0.35;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(0.5, when + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, end);
  o.start(when); o2.start(when); o.stop(end + 0.02); o2.stop(end + 0.02);
}

function elapsed() { return ctx ? ctx.currentTime - startAt : 0; }

function currentIndex(t) {
  let k = -1;
  for (let i = 0; i < song.notes.length; i++) { if (song.notes[i].t0 <= t) k = i; else break; }
  return k;
}

function show(i, t) {
  const n = i >= 0 ? song.notes[i] : null;
  $("bigNote").innerHTML = n ? NAMES[n.midi % 12] + "<small>" + (Math.floor(n.midi / 12) - 1) + "</small>" : "&ndash;";
  $("hz").textContent = n ? n.hz.toFixed(1) + " Hz" : " ";
  $("idx").textContent = n ? "note " + (i + 1) + " of " + song.notes.length : " ";
  document.querySelectorAll(".chip").forEach((el, k) => el.classList.toggle("on", k === i));
  $("prog").style.width = Math.min(100, Math.max(0, t / total * 100)) + "%";
  $("time").textContent = fmt(Math.max(0, t) * 1000) + " / " + fmt(total * 1000);
}

let lastIdx = -2;
function tick() {
  const t = Math.min(elapsed(), total);
  const i = currentIndex(t);
  if (i !== lastIdx) {
    lastIdx = i; drawStaff(i);
    const wrap = $("staffwrap"), x = PAD_L + i * GAP;
    if (i >= 0 && (x < wrap.scrollLeft + 40 || x > wrap.scrollLeft + wrap.clientWidth - 60)) wrap.scrollLeft = Math.max(0, x - 60);
  }
  show(i, t);
  if (playing && elapsed() >= total + 0.3) {
    playing = false; finished = true; $("play").textContent = "Play again";
    if (ctx) ctx.suspend();
    return;
  }
  if (playing) raf = requestAnimationFrame(tick);
}

async function togglePlay() {
  if (!ctx || finished) {
    if (ctx) { try { await ctx.close(); } catch (e) {} }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    startAt = ctx.currentTime + 0.25;
    song.notes.forEach(n => pluck(n.hz, startAt + n.t0, n.t1 - n.t0));
    finished = false; playing = true; lastIdx = -2;
    $("play").textContent = "Pause"; tick(); return;
  }
  if (playing) { await ctx.suspend(); playing = false; cancelAnimationFrame(raf); $("play").textContent = "Resume"; }
  else { await ctx.resume(); playing = true; $("play").textContent = "Pause"; tick(); }
}

async function restart() {
  if (ctx) { try { await ctx.close(); } catch (e) {} }
  ctx = null; playing = false; finished = false; cancelAnimationFrame(raf); lastIdx = -2;
  $("play").textContent = "Play"; drawStaff(-1); show(-1, 0);
}

function tapNote(i) {
  const c = new (window.AudioContext || window.webkitAudioContext)();
  const prev = ctx; ctx = c; pluck(song.notes[i].hz, c.currentTime + 0.02, 0.5); ctx = prev;
  show(i, song.notes[i].t0); drawStaff(i); setTimeout(() => c.close(), 1500);
}

/* ---- start ---- */
function showSong(s) {
  song = s; total = s.notes[s.notes.length - 1].t1;
  $("status").hidden = true; $("player").hidden = false;
  $("title").textContent = s.name;
  $("meta").textContent = s.notes.length + " notes · " + fmt(total * 1000);
  const chips = $("chips"); chips.textContent = "";
  s.notes.forEach((n, i) => {
    const b = document.createElement("button"); b.className = "chip"; b.type = "button";
    b.innerHTML = "<b>" + NAMES[n.midi % 12] + "</b>" + (Math.floor(n.midi / 12) - 1) + "<span>" + n.hz.toFixed(0) + "Hz</span>";
    b.onclick = () => tapNote(i); chips.appendChild(b);
  });
  drawStaff(-1); show(-1, 0);
  $("play").onclick = togglePlay; $("restart").onclick = restart;
  window.addEventListener("resize", () => drawStaff(lastIdx));
}

function fail(text, hint) {
  const el = $("status"); el.hidden = false; el.className = "msg";
  el.innerHTML = "";
  const p = document.createElement("p"); p.className = "err"; p.textContent = text; el.appendChild(p);
  if (hint) { const q = document.createElement("p"); q.className = "meta"; q.textContent = hint; el.appendChild(q); }
}

(async function () {
  const q = new URLSearchParams(location.search);
  if (q.has("demo")) { showSong(demoSong()); return; }
  const tok = q.get("b");
  if (!tok) { fail("No song in this link.", "Scan the QR code on your Uninote device, or add ?demo to this address to hear a sample."); return; }
  let id;
  try { id = decodeToken(tok); } catch (e) { fail("This link looks damaged.", "Scan the QR code again."); return; }
  try {
    const r = await fetch(READ_URL + encodeURIComponent(id), { headers: { "Accept": "application/json" } });
    if (r.status === 404) { fail("This song is no longer online.", "Share it again from the device's Library."); return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    showSong(parseSong(await r.json()));
  } catch (e) {
    const offline = e instanceof TypeError;       // network down, or the song store blocked this page
    fail("Couldn't load the song.", offline
      ? "Check your internet connection and try again. If it keeps failing, the song store may be blocking this page."
      : String(e.message || e));
  }
})();
</script>
</body>
</html>
